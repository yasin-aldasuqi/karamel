# Fly.io settings for Karamel's server. Deploy from this folder with: fly deploy --ha=false
# (one machine; see README.md, "Hosting on Fly.io").

app = "karamel-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Runs "dotnet Karamel.Api.dll migrate" in a temporary machine with the new image before the
  # new version goes live. If it fails, the deploy stops and the old version keeps running.
  release_command = "migrate"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # The workstation garbage collector uses less memory; right for a 256 MB machine.
  DOTNET_gcServer = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the push sender runs inside the app every 5 seconds, so the machine must never
  # be stopped for being idle.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
